name: Controller checks
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements/checks-py311.txt
      - run: PYTHONPATH=src python -m pytest -p no:cacheprovider tests -q -k 'not native_repeatability_and_zero_margin_equivalence'
